name: Build Candidate Image (main)

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pipeline:
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/pipeline.yml
    with:
      environment: staging
      cache_scope: staging
    secrets: inherit
