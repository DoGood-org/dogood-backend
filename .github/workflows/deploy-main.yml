name: Build Candidate Image (main)

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    permissions:
      id-token: write
      contents: read
      actions: read
    uses: ./.github/workflows/build-scan-push.yml
    with:
      environment: staging
    secrets: inherit

  notify:
    needs: [ci, build]
    # Runs on success and on failure of any stage.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: Notify Discord
        uses: ./.github/notify-discord
        with:
          webhook_url: ${{ secrets.DISCORD_NOTIFICATION_WEBHOOK }}
