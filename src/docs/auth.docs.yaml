openapi: 3.0.3
info:
  title: Auth API
  version: 1.0.0
  description: Authentication & Authorization endpoints
servers:
  - url: http://localhost:5000/api/auth
    description: Local server

paths:
  /signup:
    post:
      summary: User registration
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: User created. Verification email sent.
        '409':
          description: User already exists.

  /login:
    post:
      summary: User login
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful login, cookies set
        '400':
          description: Invalid credentials
        '403':
          description: Email not verified

  /logout:
    post:
      summary: Logout user
      tags: [Auth]
      responses:
        '204':
          description: Successfully logged out

  /verify-email/{verificationCode}:
    get:
      summary: Verify email address
      tags: [Auth]
      parameters:
        - name: verificationCode
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Email verified
        '400':
          description: Invalid or expired code

  /resend-verification:
    post:
      summary: Resend email verification link
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Verification email resent

  /current-user:
    get:
      summary: Get current user
      tags: [Auth]
      security:
        - cookieAuth: []
      responses:
        '200':
          description: User data retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Unauthorized

  /refresh-token:
    post:
      summary: Refresh access & refresh tokens
      tags: [Auth]
      responses:
        '200':
          description: Tokens refreshed successfully
        '401':
          description: Missing token
        '403':
          description: Invalid token

  /forgot-password:
    post:
      summary: Request password reset email
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Reset email sent

  /reset-password/{resetPasswordToken}:
    post:
      summary: Reset password with token
      tags: [Auth]
      parameters:
        - name: resetPasswordToken
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset successfully
        '400':
          description: Invalid reset code

  /resent-forgot-password:
    post:
      summary: Resend forgot password email
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Reset email resent

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: accessToken

  schemas:
    SignUpRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    ResetPasswordRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          format: password

    UserResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        avatar:
          type: string
          nullable: true
        siteRole:
          type: string
          enum: [ADMIN, USER]
        settings:
          type: object
          properties:
            theme:
              type: string
            language:
              type: string
