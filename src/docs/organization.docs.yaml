openapi: 3.0.3
info:
  title: Organization API
  version: 1.0.0
  description: API for managing organizations, members, and join requests

servers:
  - url: http://localhost:5000/
    description: Local server

tags:
  - name: Organization
  - name: Members
  - name: JoinRequest

paths:

  /organization/create:
    post:
      tags: [Organization]
      summary: Create a new organization (authenticated user only)
      operationId: createOrganization
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationInput'
            example:
              organizationName: "Tech Corp"
      responses:
        '201':
          description: Organization created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              examples:
                orgCreated:
                  value:
                    status: success
                    code: ORGANIZATION_CREATED
                    message: Organization was created successfully
                    data: null
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Email not verified or unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Organization already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /organizations:
    get:
      tags: [Organization]
      summary: Get organizations by name (search)
      parameters:
        - in: query
          name: name
          required: true
          description: Part of the organization name to search for
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Success - Returns a list of organizations
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  code:
                    type: string
                    example: "ORGANIZATION_DATA_RETRIEVED"
                  message:
                    type: string
                    example: "Organizations found"
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrganizationSearchItem'
        '400':
          description: Validation error (empty or missing name)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /organization/{id}:
    get:
      tags: [Organization]
      summary: Get organization by ID
      operationId: getOrganizationById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Organization UUID
      responses:
        '200':
          description: Organization data retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FullOrganizationResponse'
        '404':
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      tags: [Organization]
      summary: Update organization
      operationId: updateOrganization
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganization'
      responses:
        '200':
          description: Organization updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FullOrganizationResponse'
        '404':
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [Organization]
      summary: Delete organization
      operationId: deleteOrganization
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Organization deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /{organizationId}/members:
    get:
      tags: [Members]
      summary: Get all members of an organization
      operationId: getOrganizationMembers
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of organization members
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  code: { type: string }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      members:
                        type: array
                        items:
                          $ref: '#/components/schemas/OrganizationMember'
        '404':
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /organization/members:
    post:
      tags: [Members]
      summary: Add a member to organization
      operationId: addMember
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberToOrganization'
      responses:
        '201':
          description: Member added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberResponse'
        '404':
          description: Organization or User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [Members]
      summary: Remove member from organization
      operationId: removeMember
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, organizationId]
              properties:
                userId: { type: string }
                organizationId: { type: string }
      responses:
        '200':
          description: Member removed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Member not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /organization/members/role:
    patch:
      tags: [Members]
      summary: Update member role
      operationId: updateMemberRole
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleMemberInput'
      responses:
        '200':
          description: Member role updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberResponse'
        '404':
          description: Member not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /organization/join-request:
    post:
      tags: [JoinRequest]
      summary: Create a join request
      operationId: createJoinRequest
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJoinRequestInput'
      responses:
        '201':
          description: Join request created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinRequestResponse'
        '404':
          description: Sender or Receiver not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /organization/join-request/status:
    patch:
      tags: [JoinRequest]
      summary: Update join request status
      operationId: updateJoinRequestStatus
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateJoinRequestStatusInput'
      responses:
        '200':
          description: Join request status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinRequestResponse'
        '404':
          description: Join request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: accessToken

  schemas:

    CreateOrganizationInput:
      type: object
      required: [organizationName]
      properties:
        organizationName:
          type: string
          minLength: 2
          maxLength: 50

    ErrorResponse:
      type: object
      required: [status, statusCode, code, message]
      properties:
        status:
          type: string
          enum: [error]
        statusCode:
          type: integer
        code:
          type: string
        message:
          type: string
        details:
          type: object
          nullable: true

    SuccessResponse:
      type: object
      properties:
        status:
          type: string
        code:
          type: string
        message:
          type: string
        data:
          type: object
          nullable: true

    UpdateOrganization:
      type: object
      properties:
        organizationName: { type: string }
        location:
          type: object
          properties:
            country: { type: string }
            region: { type: string }
            city: { type: string }
        phoneNumber: { type: string }
        email: { type: string }
        description: { type: string }
        moreInfo: { type: string }
        avatar: { type: string, format: uri }

    OrganizationMember:
      type: object
      properties:
        userId: { type: string }
        role: { type: string }
        status: { type: string }
        user:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            email: { type: string }

    FullOrganizationResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                organization:
                  type: object
                  properties:
                    id: { type: string }
                    name: { type: string }
                    createdAt: { type: string, format: date-time }
    
    OrganizationSearchItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        avatar:
          type: string
          nullable: true