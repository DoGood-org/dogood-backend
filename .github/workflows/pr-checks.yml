name: PR checks

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pipeline:
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/pipeline.yml
    with:
      cache_scope: develop
    secrets: inherit
