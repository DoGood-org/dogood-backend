tags:
  - name: Auth
    description: Authentication and user management

paths:
  /signup:
    post:
      summary: Register a new user
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUp'
      responses:
        '201':
          description: User created. Please check your email to verify.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '409':
          description: User already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /signup/organization:
    post:
      summary: Register a user with an organization
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanySignUp'
      responses:
        '201':
          description: User and organization created, please verify your email
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '409':
          description: User or organization already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /login:
    post:
      summary: User login
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      responses:
        '200':
          description: Successful login
          headers:
          Set-Cookie:
            description: >
              HTTP-only cookies containing access and refresh tokens.
            schema:
              type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'
        '400':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /logout:
    post:
      summary: Logout
      tags:
        - Auth
      responses:
        '204':
          description: Successful logout
        '400':
          description: No refresh token provided

  /verify-email/{verificationCode}:
    get:
      summary: Verify email by code
      tags:
        - Auth
      parameters:
        - in: path
          name: verificationCode
          schema:
            type: string
          required: true
          description: Email verification code
      responses:
        '200':
          description: Email successfully verified or already verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: Invalid or expired verification code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /current-user:
    get:
      summary: Get current user info
      tags:
        - Auth
      security:
        - cookieAuth: []
      responses:
        '200':
          description: User information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoDetailed'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /refresh-token:
    post:
      summary: Refresh access token
      tags:
        - Auth
      responses:
        '200':
          description: Access token refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          description: Missing or invalid refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token

  schemas:
    SignUp:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          minLength: 4
          maxLength: 30
          example: 'Viktor'
        email:
          type: string
          format: email
          example: 'user@example.com'
        password:
          type: string
          minLength: 6
          example: 'password123'

    Login:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: 'user@example.com'
        password:
          type: string
          minLength: 6
          example: 'password123'

    CompanySignUp:
      type: object
      required:
        - name
        - email
        - password
        - organizationName
      properties:
        name:
          type: string
          minLength: 4
          maxLength: 30
          example: 'Viktor'
        email:
          type: string
          format: email
          example: 'user@example.com'
        password:
          type: string
          minLength: 6
          example: 'password123'
        organizationName:
          type: string
          minLength: 2
          maxLength: 50
          example: 'My Organization'

    UserInfo:
      type: object
      properties:
        id:
          type: integer
          example: 3
        name:
          type: string
          example: 'Viktor'
        email:
          type: string
          format: email
          example: 'user@example.com'
        siteRole:
          type: string
          example: 'USER'

    UserInfoDetailed:
      allOf:
        - $ref: '#/components/schemas/UserInfo'
        - type: object
          properties:
            settings:
              type: object
              nullable: true
            avatar:
              type: string
              nullable: true
              example: 'https://example.com/avatar.jpg'

    OrganizationInfo:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: 'My Organization'

    Error:
      type: object
      properties:
        code:
          type: integer
          example: 400
        message:
          type: string
          example: 'Error message'
