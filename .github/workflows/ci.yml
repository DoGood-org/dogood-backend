name: CI

on:
  push:
  workflow_dispatch:

jobs:
  cve-checks:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Verify pnpm lockfile
        run: pnpm install --frozen-lockfile

      - name: Run CVE checks on npm packages
        run: pnpm audit

      - name: Run tests
        uses: ./.github/testing