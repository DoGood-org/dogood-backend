openapi: 3.0.3
info:
  title: Organization API
  version: 1.0.0
  description: API for managing organizations, members, and join requests

servers:
  - url: http://localhost:5000/
    description: Local server

tags:
  - name: Organization
  - name: Members
  - name: JoinRequest

paths:
  /organization/signup:
    post:
      tags: [Organization]
      summary: Register a new organization
      operationId: registerOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationSignUp'
      responses:
        '201':
          description: Organization account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              examples:
                orgCreated:
                  value:
                    status: success
                    code: ORGANIZATION_CREATED
                    message: Organization created successfully
                    data:
                      organizationId: "org-uuid"
        '409':
          description: Organization or user already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                orgExists:
                  value:
                    status: error
                    statusCode: 409
                    code: ORGANIZATION_ALREADY_EXISTS
                    message: Organization with this email or name already exists
                    details: null
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /organization/{id}:
    get:
      tags: [Organization]
      summary: Get organization by ID
      operationId: getOrganizationById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Organization UUID
      responses:
        '200':
          description: Organization data retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FullOrganizationResponse'
              examples:
                orgFound:
                  value:
                    status: success
                    code: ORGANIZATION_RETRIEVED
                    message: Organization retrieved successfully
                    data:
                      organization:
                        id: "org-uuid"
                        name: "Tech Corp"
                        createdAt: "2025-11-25T12:00:00Z"
                        phoneNumber: "+1234567890"
                        email: "info@techcorp.com"
                        description: "We are a tech company"
                        moreInfo: "Founded in 2020"
                        avatar: "https://example.com/logo.png"
                        location:
                          country: "Canada"
                          region: "Newfoundland"
                          city: "St. John's"
                        members:
                          - userId: "user-uuid"
                            role: MODERATOR
                            status: ACTIVE
                            user:
                              id: "user-uuid"
                              name: "John Doe"
                              email: "john@example.com"
                              profile:
                                avatar: "https://example.com/avatar.png"
                                bio: "CEO"
                                location: "St. John's"
                        tasks:
                          - id: "task-uuid"
                            title: "Complete project"
                            locationName: null
                            reviews: []
                        reviews: []
                        reviewsWrittenOrg: []
                        hostProfile: null
                        paymentOption: null
        '404':
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  value:
                    status: error
                    statusCode: 404
                    code: ORGANIZATION_NOT_FOUND
                    message: Organization not found
                    details: null

    patch:
      tags: [Organization]
      summary: Update organization
      operationId: updateOrganization
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganization'
      responses:
        '200':
          description: Organization updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FullOrganizationResponse'
              examples:
                orgUpdated:
                  value:
                    status: success
                    code: ORGANIZATION_UPDATED
                    message: Organization updated successfully
                    data:
                      organization:
                        id: "org-uuid"
                        name: "Tech Corp Updated"
                        createdAt: "2025-11-25T12:00:00Z"
                        phoneNumber: "+1234567890"
                        email: "info@techcorp.com"
                        description: "Updated description"
                        moreInfo: "Updated info"
                        avatar: "https://example.com/logo.png"
                        location:
                          country: "Canada"
                          region: "Newfoundland"
                          city: "St. John's"
                        members: []
                        tasks: []
                        reviews: []
                        reviewsWrittenOrg: []
                        hostProfile: null
                        paymentOption: null
        '404':
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [Organization]
      summary: Delete organization
      operationId: deleteOrganization
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Organization and related data deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              examples:
                deleted:
                  value:
                    status: success
                    code: ORGANIZATION_DELETED
                    message: Organization deleted successfully
                    data: null
        '404':
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /{organizationId}/members:
    get:
      tags: [Members]
      summary: Get all members of an organization
      operationId: getOrganizationMembers
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of organization members
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  code: { type: string, example: MEMBERS_LIST_RETRIEVED }
                  message: { type: string, example: Members retrieved successfully }
                  data:
                    type: object
                    properties:
                      members:
                        type: array
                        items:
                          $ref: '#/components/schemas/OrganizationMember'
        '404':
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /organization/members:
    post:
      tags: [Members]
      summary: Add a member to organization
      operationId: addMember
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberToOrganization'
      responses:
        '201':
          description: Member added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberResponse'
              examples:
                added:
                  value:
                    status: success
                    code: MEMBER_ADDED
                    message: Member added successfully
                    member:
                      userId: "user-uuid"
                      role: MEMBER
                      status: ACTIVE
        '404':
          description: Organization or User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [Members]
      summary: Remove member from organization
      operationId: removeMember
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, organizationId]
              properties:
                userId: { type: string }
                organizationId: { type: string }
      responses:
        '200':
          description: Member removed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              examples:
                removed:
                  value:
                    status: success
                    code: MEMBER_REMOVED
                    message: Member removed successfully
                    data: null
        '404':
          description: Member not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /organization/members/role:
    patch:
      tags: [Members]
      summary: Update member role
      operationId: updateMemberRole
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleMemberInput'
      responses:
        '200':
          description: Member role updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberResponse'
              examples:
                roleUpdated:
                  value:
                    status: success
                    code: MEMBER_ROLE_UPDATED
                    message: Member role updated successfully
                    member:
                      userId: "user-uuid"
                      role: MODERATOR
                      status: ACTIVE
        '404':
          description: Member not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /organization/join-request:
    post:
      tags: [JoinRequest]
      summary: Create a join request
      operationId: createJoinRequest
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJoinRequestInput'
      responses:
        '201':
          description: Join request created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinRequestResponse'
              examples:
                created:
                  value:
                    status: success
                    code: JOIN_REQUEST_CREATED
                    message: Join request created successfully
                    data:
                      joinRequest:
                        id: "join-request-uuid"
                        senderId: "user-uuid"
                        receiverOrganizationId: "org-uuid"
                        direction: FROM_USER
                        status: PENDING
        '404':
          description: Sender or Receiver not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /organization/join-request/status:
    patch:
      tags: [JoinRequest]
      summary: Update join request status
      operationId: updateJoinRequestStatus
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateJoinRequestStatusInput'
      responses:
        '200':
          description: Join request status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinRequestResponse'
              examples:
                updated:
                  value:
                    status: success
                    code: JOIN_REQUEST_STATUS_UPDATED
                    message: Join request status updated successfully
                    data:
                      joinRequest:
                        id: "join-request-uuid"   
        '404':
          description: Join request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: accessToken

  schemas:
    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          enum: [error]
        statusCode:
          type: integer
        code:
          type: string
        message:
          type: string
        details:
          type: object
          nullable: true
      required: [status, statusCode, code, message]

    SuccessResponse:
      type: object
      properties:
        status:
          type: string
        code:
          type: string
          description: Machine-readable success code (SuccessCode enum)
        message:
          type: string
        data:
          type: object
          nullable: true

    OrganizationSignUp:
      type: object
      required: [name, email, password, organizationName]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        password: { type: string }
        organizationName: { type: string }

    UpdateOrganization:
      type: object
      properties:
        organizationName: { type: string }
        location:
          type: object
          properties:
            country: { type: string }
            region: { type: string }
            city: { type: string }
        phoneNumber: { type: string }
        email: { type: string }
        description: { type: string }
        moreInfo: { type: string }
        avatar: { type: string, format: uri }

    OrganizationMember:
      type: object
      properties:
        userId: { type: string }
        role: { type: string }
        status: { type: string }
        user:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            email: { type: string }
            profile:
              type: object
              nullable: true
              properties:
                avatar: { type: string }
                bio: { type: string }
                location: { type: string }

    FullOrganizationResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                organization:
                  type: object
                  properties:
                    id: { type: string }
                    name: { type: string }
                    createdAt: { type: string, format: date-time }
                    phoneNumber: { type: string, nullable: true }
                    email: { type: string, nullable: true }
                    description: { type: string, nullable: true }
                    moreInfo: { type: string, nullable: true }
                    avatar: { type: string, nullable: true }
                    location:
                      type: object
                      nullable: true
                      properties:
                        country: { type: string }
                        region: { type: string }
                        city: { type: string }
                    paymentOption: { type: object, nullable: true }
                    hostProfile: { type: object, nullable: true }
                    members:
                      type: array
                      items:
                        $ref: '#/components/schemas/OrganizationMember'
                    tasks:
                      type: array
                      items:
                        type: object
                    reviews:
                      type: array
                      items:
                        type: object
                    reviewsWrittenOrg:
                      type: array
                      items:
                        type: object

    AddMemberToOrganization:
      type: object
      required: [userId, organizationId, role, status]
      properties:
        userId: { type: string }
        organizationId: { type: string }
        role: { type: string, enum: ['MODERATOR','MEMBER'] }
        status: { type: string, enum: ['PENDING','ACTIVE','INVITED','REMOVED'] }

    UpdateRoleMemberInput:
      type: object
      required: [organizationId, userId, role]
      properties:
        organizationId: { type: string }
        userId: { type: string }
        role: { type: string, enum: ['MODERATOR','MEMBER'] }

    CreateJoinRequestInput:
      type: object
      required: [senderId, receiverOrganizationId, direction]
      properties:
        senderId: { type: string }
        receiverOrganizationId: { type: string }
        receiverUserId: { type: string }
        direction: { type: string, enum: ['FROM_USER','FROM_ORGANIZATION'] }
        status: { type: string, enum: ['PENDING','ACCEPTED','REJECTED','CANCELLED'] }

    UpdateJoinRequestStatusInput:
      type: object
      required: [id, status]
      properties:
        id: { type: string }
        status: { type: string, enum: ['PENDING','ACCEPTED','REJECTED','CANCELLED'] }

    MemberResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            member:
              type: object

    JoinRequestResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                joinRequest:
                  type: object
