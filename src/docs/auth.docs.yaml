openapi: 3.0.0
info:
  title: Auth API
  version: 1.1.0
  description: Authentication and user management

tags:
  - name: Auth
    description: Authentication and user management

paths:
  /auth/signup:
    post:
      summary: Register a new user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUp'
      responses:
        '201':
          description: User created. Please check your email to verify.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '409':
          description: User already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/signup/organization:
    post:
      summary: Register a user with an organization
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanySignUp'
      responses:
        '201':
          description: Organization and user created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '409':
          description: User or organization already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      summary: User login
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      responses:
        '200':
          description: Successful login
          headers:
            Set-Cookie:
              description: HTTP-only cookies with tokens
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: User logged in successfully
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      email:
                        type: string
                      siteRole:
                        type: string
                      settings:
                        type: object
                        properties:
                          theme:
                            type: string
                            example: light
                          language:
                            type: string
                            example: en
        '400':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Email not verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      summary: Logout
      tags: [Auth]
      responses:
        '200':
          description: Successful logout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: No refresh token provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/verify-email/{verificationCode}:
    get:
      summary: Verify email
      tags: [Auth]
      parameters:
        - in: path
          name: verificationCode
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Email verified or already verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Invalid or expired verification code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/current-user:
    get:
      summary: Get current user
      tags: [Auth]
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Current user data
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: User data retrieved
                  user:
                    $ref: '#/components/schemas/UserInfoDetailed'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/refresh-token:
    post:
      summary: Refresh access token
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  description: The refresh token to generate a new access token
      responses:
        '200':
          description: New access token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: New access token issued
                  accessToken:
                    type: string
                    description: The new access token
        '401':
          description: Missing or invalid refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Refresh token expired or email not verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token

  schemas:
    MessageResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Action successful

    Error:
      type: object
      properties:
        code:
          type: integer
          example: 400
        message:
          type: string
          example: Error message

    SignUp:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          example: Viktor
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          example: password123

    Login:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    CompanySignUp:
      type: object
      required: [name, email, password, organizationName]
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
        organizationName:
          type: string

    UserInfo:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        siteRole:
          type: string

    UserInfoDetailed:
      allOf:
        - $ref: '#/components/schemas/UserInfo'
        - type: object
          properties:
            bio:
              type: string
              nullable: true
            gender:
              type: string
              enum: [MALE, FEMALE, OTHER]
              nullable: true
            birthDate:
              type: string
              format: date
              nullable: true
            phoneNumber:
              type: string
              nullable: true
            isEmailVerified:
              type: boolean
            userSettings:
              type: object
              properties:
                theme:
                  type: string
                language:
                  type: string
            location:
              type: object
              nullable: true
              properties:
                id:
                  type: integer
                country:
                  type: string
                region:
                  type: string
                city:
                  type: string
            hostedTasks:
              type: array
              items:
                $ref: '#/components/schemas/Task'
            joinedTasks:
              type: array
              items:
                $ref: '#/components/schemas/Task'
            reviewsWritten:
              type: array
              items:
                $ref: '#/components/schemas/Review'
            reviewsReceived:
              type: array
              items:
                $ref: '#/components/schemas/Review'
            organizations:
              type: array
              items:
                type: object
                properties:
                  organization:
                    $ref: '#/components/schemas/OrganizationInfo'
            paymentOptions:
              type: array
              items:
                $ref: '#/components/schemas/PaymentOption'

    Task:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        status:
          type: string

    Review:
      type: object
      properties:
        id:
          type: integer
        rating:
          type: integer
        comment:
          type: string
        createdAt:
          type: string
          format: date-time

    PaymentOption:
      type: object
      properties:
        id:
          type: integer
        method:
          type: string
        last4:
          type: string

    OrganizationInfo:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string