name: CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cve-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Test the exact commit build-scan-push turns into an image (PR head, not the merge commit).
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node and pnpm
        uses: ./.github/setup

      - name: Run CVE checks on npm packages
        run: pnpm audit --audit-level high

  build-and-test:
    name: Build NestJS and run tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Test the exact commit build-scan-push turns into an image (PR head, not the merge commit).
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node and pnpm
        uses: ./.github/setup

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Build NestJS
        run: pnpm build

      - name: Run unit tests
        uses: ./.github/testing
