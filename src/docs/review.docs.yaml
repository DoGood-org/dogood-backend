openapi: 3.0.3
info:
  title: Reviews API
  description: API for creating and managing user, organization, and platform reviews
  version: 1.1.0

paths:
  /reviews/users:
    post:
      summary: Create a review from a user to another user
      tags:
        - User Reviews
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserReview'
      responses:
        '201':
          description: Review created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'
        '400':
          description: Invalid input
        '401':
          description: Not authenticated
        '409':
          description: Review already exists

  /reviews/organizations:
    post:
      summary: Create a review from a user to an organization
      tags:
        - Organization Reviews
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgReview'
      responses:
        '201':
          description: Review created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'
        '401':
          description: Not authenticated
        '409':
          description: Review already exists

  /reviews/platform:
    post:
      summary: Create a review from a user to the platform
      tags:
        - Platform Reviews
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformReview'
      responses:
        '201':
          description: Review created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'
        '401':
          description: Not authenticated
        '409':
          description: Review already exists

  /reviews/{taskId}/users:
    post:
      summary: Create a task-related review for a user (task host only)
      tags:
        - Task Reviews
      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserReview'
      responses:
        '201':
          description: Review created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'
        '401':
          description: Not authenticated
        '403':
          description: Only the task host can leave reviews
        '404':
          description: Task not found
        '409':
          description: Review already exists

  /reviews/{id}:
    get:
      summary: Get a review by ID
      tags:
        - Reviews
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Review found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'
        '404':
          description: Review not found
    delete:
      summary: Delete a review
      tags:
        - Reviews
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Review deleted successfully
        '404':
          description: Review not found

  /reviews/by-user/{id}:
    get:
      summary: Get all reviews by a user
      tags:
        - Reviews
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of reviews
          content:
            application/json:
              schema:
                type: object
                properties:
                  reviews:
                    type: array
                    items:
                      $ref: '#/components/schemas/Review'

  /reviews/all:
    get:
      summary: Get reviews with optional filters
      tags:
        - Reviews
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [user, organisation, platform]
        - name: target_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [approved, pending, rejected]
      responses:
        '200':
          description: List of reviews
          content:
            application/json:
              schema:
                type: object
                properties:
                  reviews:
                    type: array
                    items:
                      $ref: '#/components/schemas/Review'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    UserReview:
      type: object
      required:
        - targetUserId
        - rating
      properties:
        targetUserId:
          type: string
          format: uuid
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 1000
          nullable: true

    OrgReview:
      type: object
      required:
        - organizationId
        - rating
      properties:
        organizationId:
          type: string
          format: uuid
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 1000
          nullable: true

    PlatformReview:
      type: object
      required:
        - rating
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 1000
          nullable: true

    Review:
      type: object
      properties:
        id:
          type: string
        rating:
          type: integer
        comment:
          type: string
          nullable: true
        authorType:
          type: string
          enum: [USER, ORGANIZATION]
        authorUserId:
          type: string
          nullable: true
        authorOrganizationId:
          type: string
          nullable: true
        targetType:
          type: string
          enum: [USER, ORGANIZATION, PLATFORM]
        targetUserId:
          type: string
          nullable: true
        targetOrganizationId:
          type: string
          nullable: true
        targetPlatformId:
          type: string
          nullable: true
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ReviewResponse:
      type: object
      properties:
        status:
          type: string
        data:
          $ref: '#/components/schemas/Review'
