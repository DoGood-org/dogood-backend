openapi: 3.0.3
info:
  title: Organization API
  version: 1.0.0
  description: >
    API for managing organizations, members, and join requests. 
    Protected routes require a valid accessToken cookie.
    Now follows a double-opt-in flow for organization membership.

servers:
  - url: http://localhost:5000/
    description: Local development server

tags:
  - name: Organization
  - name: Members
  - name: JoinRequest

paths:
  /organization/create:
    post:
      tags: [Organization]
      summary: Create a new organization
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /organization/{id}:
    get:
      tags: [Organization]
      summary: Get organization by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FullOrganizationResponse'
    patch:
      tags: [Organization]
      summary: Update organization (ADMIN only)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganization'
      responses:
        '200':
          description: Updated
    delete:
      tags: [Organization]
      summary: Delete organization (ADMIN/HOST only)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Deleted

  /organization/members/invite:
    post:
      tags: [Members]
      summary: Invite a user to organization (ADMIN/MODERATOR only)
      description: Creates a JoinRequest with direction 'FROM_ORGANIZATION'. The user will be notified and must accept the invitation.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteMemberInput'
      responses:
        '201':
          description: Invitation sent successfully
        '403':
          description: Forbidden - Insufficient permissions
        '409':
          description: Conflict - User is already a member

  /organization/members/role:
    patch:
      tags: [Members]
      summary: Update member role (ADMIN only)
      description: Updates role and notifies the target user.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleInput'
      responses:
        '200':
          description: Role updated

  /organization/members/{userId}:
    delete:
      tags: [Members]
      summary: Remove a member from organization
      description: Deletes the membership record and notifies the user.
      security:
        - cookieAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: organizationId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Member removed successfully

  /organization/join-request:
    post:
      tags: [JoinRequest]
      summary: Create a join request or invitation
      description: Used by users to join an org (FROM_USER) or by orgs to invite a user (FROM_ORGANIZATION).
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJoinRequestInput'
      responses:
        '201':
          description: Request created and notification sent

  /organization/join-request/status:
    patch:
      tags: [JoinRequest]
      summary: Update join request status
      description: ACCEPTED status triggers automatic membership creation.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateJoinRequestStatusInput'
      responses:
        '200':
          description: Status updated (Membership created if ACCEPTED)

  /organization/{organizationId}/join-requests:
    get:
      tags: [JoinRequest]
      summary: Get all pending join requests for an organization
      security:
        - cookieAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinRequestsListResponse'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: accessToken

  schemas:
    SuccessResponse:
      type: object
      properties:
        status: { type: string, example: "success" }
        code: { type: string }
        message: { type: string }
        data: { type: object, nullable: true }

    ErrorResponse:
      type: object
      required: [status, statusCode, code, message]
      properties:
        status: { type: string, example: "error" }
        statusCode: { type: integer }
        code: { type: string }
        message: { type: string }

    CreateOrganizationInput:
      type: object
      required: [organizationName, description, location, phoneNumber, email]
      properties:
        organizationName: { type: string, minLength: 2, maxLength: 50 }
        description: { type: string, maxLength: 1000 }
        avatar: { type: string, format: uri }
        location:
          type: object
          properties:
            country: { type: string }
            region: { type: string }
            city: { type: string }
        phoneNumber: { type: string }
        email: { type: string, format: email }

    UpdateOrganization:
      type: object
      properties:
        organizationName: { type: string }
        description: { type: string }
        phoneNumber: { type: string }
        location:
          type: object
          properties:
            country: { type: string }
            city: { type: string }
            address: { type: string }

    InviteMemberInput:
      type: object
      required: [userId, organizationId, role]
      properties:
        userId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        role: { type: string, enum: [MODERATOR, MEMBER] }

    UpdateRoleInput:
      type: object
      required: [organizationId, userId, role]
      properties:
        organizationId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        role: { type: string, enum: [MODERATOR, MEMBER] }

    CreateJoinRequestInput:
      type: object
      required: [direction]
      properties:
        senderOrganizationId: { type: string, format: uuid, nullable: true }
        receiverOrganizationId: { type: string, format: uuid, nullable: true }
        receiverUserId: { type: string, format: uuid, nullable: true }
        direction: { type: string, enum: [FROM_USER, FROM_ORGANIZATION] }

    UpdateJoinRequestStatusInput:
      type: object
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [ACCEPTED, REJECTED, CANCELLED] }

    JoinRequestResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, ACCEPTED, REJECTED, CANCELLED] }
        direction: { type: string, enum: [FROM_USER, FROM_ORGANIZATION] }
        createdAt: { type: string, format: date-time }
        sender:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
        senderOrganization:
          type: object
          properties:
            id: { type: string }
            name: { type: string }

    JoinRequestsListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                joinRequests:
                  type: array
                  items:
                    $ref: '#/components/schemas/JoinRequestResponse'

    FullOrganizationResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                organization:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    name: { type: string }
                    description: { type: string }
                    location: { type: object }