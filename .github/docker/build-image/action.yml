name: Build Docker Image
description: Build Docker image for dogood-backend with layer cache in GitHub Actions cache

inputs:
  build_sha:
    description: Build SHA tag
    required: true
  image_name:
    description: Docker image name
    required: false
    default: dogood-backend
  dockerfile:
    description: Path to Dockerfile
    required: false
    default: Dockerfile
  context:
    description: Build context path
    required: false
    default: .
  cache_scope:
    description: Layer cache scope, so stages (develop, staging) don't overwrite each other's cache
    required: false
    default: dogood-backend

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build image
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        tags: ${{ inputs.image_name }}:${{ inputs.build_sha }}
        load: true
        cache-from: type=gha,scope=${{ inputs.cache_scope }}
        cache-to: type=gha,scope=${{ inputs.cache_scope }},mode=max
