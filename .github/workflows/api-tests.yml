name: API Automated Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  api-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: dogood_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm ci

      - name: Run Prisma Migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/dogood_db?schema=public"

      - name: Build Project
        run: npm run build

      - name: Start Backend API Server
        run: |
          nohup node dist/index.js > server.log 2>&1 &
        env:
          PORT: 5000
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/dogood_db?schema=public"
          NODE_ENV: "test"
          JWT_SECRET: "test_jwt_secret_key_12345"
          JWT_REFRESH_SECRET: "test_jwt_refresh_secret_key_12345"
          JWT_EXPIRES_IN: "1d"
          JWT_REFRESH_EXPIRES_IN: "7d"
          STRIPE_SECRET_KEY: "sk_test_mock_stripe_key_for_ci_testing"
          STRIPE_WEBHOOK_SECRET: "whsec_test_mock_secret"
          # Заглушки для поштовика, щоб реєстрація не видавала 500
          EMAIL_HOST: "localhost"
          EMAIL_PORT: "1025"
          EMAIL_SECURE: "false"

      - name: Wait for Server to be Healthy
        run: |
          for i in {1..30}; do
            if nc -z localhost 5000; then
              echo "Server is UP and listening on port 5000!"
              exit 0
            fi
            echo "Waiting for server..."
            sleep 1
          done
          echo "Server failed to start!"
          cat server.log
          exit 1

      - name: Install Newman & Reporter
        run: npm install -g newman newman-reporter-htmlextra

      - name: Ensure Environment BaseURL is set
        run: |
          node -e '
            const fs = require("fs");
            const envPath = "postman/environment.json";
            if (fs.existsSync(envPath)) {
              const data = JSON.parse(fs.readFileSync(envPath, "utf8"));
              let found = false;
              data.values = data.values.map(v => {
                if (v.key === "baseUrl" || v.key === "url") {
                  v.value = "http://localhost:5000";
                  found = true;
                }
                return v;
              });
              if (!found) {
                data.values.push({ key: "baseUrl", value: "http://localhost:5000", enabled: true, type: "default" });
              }
              fs.writeFileSync(envPath, JSON.stringify(data, null, 2));
              console.log("Environment updated with baseUrl=http://localhost:5000");
            }
          '

      - name: Run All API Tests & Generate Report
        run: |
          newman run postman/collection.json -e postman/environment.json -r htmlextra --reporter-htmlextra-export postman-report.html --suppress-exit-code

      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-html-report
          path: postman-report.html

      - name: Upload Server Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: server.log