openapi: 3.0.3
info:
  title: Reviews API
  version: 1.1.0
  description: |
    API for managing reviews between users, organizations, and the platform.
    Includes public profiles and a secured admin panel for moderation.

servers:
  - url: http://localhost:3000
    description: Local development server

tags:
  - name: Reviews
    description: Reviews management operations

paths:
  # ==== USER REVIEWS ====
  /reviews/users:
    post:
      summary: Create a user-to-user review
      tags: [Reviews]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserReviewCreateInput'
      responses:
        '201':
          description: Created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormattedReview'
        '409':
          description: User has already left a review for this target

  /reviews/users/{id}:
    get:
      summary: Get approved reviews ABOUT a user
      tags: [Reviews]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Target User ID
      responses:
        '200':
          description: List of reviews
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewsListResponseWrapper'

  # ==== ORGANIZATION REVIEWS ====
  /reviews/organizations:
    post:
      summary: Create a user-to-organization review
      tags: [Reviews]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationReviewCreateInput'
      responses:
        '201':
          description: Created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormattedReview'

  /reviews/organizations/{id}:
    get:
      summary: Get approved reviews ABOUT an organization
      tags: [Reviews]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Target Organization ID
      responses:
        '200':
          description: List of organization reviews
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewsListResponseWrapper'

  # ==== PLATFORM REVIEWS ====
  /reviews/platform:
    post:
      summary: Create a user-to-platform review
      tags: [Reviews]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformReviewCreateInput'
      responses:
        '201':
          description: Created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormattedReview'
    get:
      summary: Get approved platform reviews
      tags: [Reviews]
      responses:
        '200':
          description: List of platform reviews
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewsListResponseWrapper'

  # ==== TASK REVIEWS ====
  /reviews/{taskId}/users:
    post:
      summary: Host-to-participant task review
      tags: [Reviews]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: taskId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserReviewCreateInput'
      responses:
        '201':
          description: Created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormattedReview'

  # ==== ADMIN OPERATIONS ====
  /reviews/admin/all:
    get:
      summary: Get all reviews (Admin/Moderator only)
      tags: [Reviews]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: type
          schema:
            type: string
            enum: [user, organization, platform]
        - in: query
          name: target_id
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [PENDING, APPROVED, REJECTED]
      responses:
        '200':
          description: Complete reviews list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewsListResponseWrapper'

  # ==== INDIVIDUAL REVIEW MANAGEMENT ====
  /reviews/{id}:
    get:
      summary: Get specific review by ID
      tags: [Reviews]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Review data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormattedReview'
    patch:
      summary: Update review (Author only)
      description: Status resets to PENDING upon update.
      tags: [Reviews]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewUpdateInput'
      responses:
        '200':
          description: Updated and sent to moderation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormattedReview'
    delete:
      summary: Delete review (Author or Admin)
      tags: [Reviews]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "success" }
                  code: { type: string, example: "REVIEW_DELETED" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    UserReviewCreateInput:
      type: object
      required: [targetUserId, rating]
      properties:
        targetUserId: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, nullable: true }

    OrganizationReviewCreateInput:
      type: object
      required: [targetOrganizationId, rating]
      properties:
        targetOrganizationId: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, nullable: true }

    PlatformReviewCreateInput:
      type: object
      required: [rating]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, nullable: true }

    ReviewUpdateInput:
      type: object
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, nullable: true }

    ReviewAuthor:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        avatar: { type: string, nullable: true }

    FormattedReview:
      type: object
      properties:
        id: { type: integer }
        rating: { type: integer }
        comment: { type: string, nullable: true }
        authorType: { type: string, enum: [USER, ORGANIZATION, HOST] }
        targetType: { type: string, enum: [USER, ORGANIZATION, PLATFORM] }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        createdAt: { type: string, format: date-time }
        author: { $ref: '#/components/schemas/ReviewAuthor' }

    ReviewsListResponseWrapper:
      type: object
      properties:
        status: { type: string, example: "success" }
        code: { type: string, example: "REVIEWS_RETRIEVED" }
        data:
          type: object
          properties:
            reviews:
              type: array
              items: { $ref: '#/components/schemas/FormattedReview' }