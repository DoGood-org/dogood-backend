name: Build, Scan and Push Image

on:
  workflow_call:
    inputs:
      environment:
        description: Stage suffix for the ECR repo name (e.g. develop, staging, prod)
        required: false
        type: string
        default: develop
    secrets:
      ECR_OIDC:
        required: true
      AWS_REGION:
        required: true

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    env:
      # On PRs github.sha is a throwaway merge commit; build and tag the PR head instead.
      BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_SHA }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ECR_OIDC }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        uses: ./.github/docker/build-image
        with:
          build_sha: ${{ env.BUILD_SHA }}

      - name: Scan Docker image for vulnerabilities
        uses: ./.github/docker/test-image-vulnerabilities
        with:
          build_sha: ${{ env.BUILD_SHA }}

      - name: Push Docker image to ECR
        uses: ./.github/docker/push-to-ecr
        with:
          ecr_registry: ${{ steps.login-ecr.outputs.registry }}
          build_sha: ${{ env.BUILD_SHA }}
          environment: ${{ inputs.environment }}
