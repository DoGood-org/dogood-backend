name: Run Postman API Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  api-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: dogood_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mailhog:
        image: mailhog/mailhog
        ports:
          - 1025:1025
          - 8025:8025

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Run Prisma migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/dogood_db?schema=public"

      - name: Seed Test User directly to Database
        run: npx prisma db seed
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/dogood_db?schema=public"

      - name: Start Backend API Server
        run: |
          nohup node dist/index.js > server.log 2>&1 &
        env:
          PORT: 5000
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/dogood_db?schema=public"
          NODE_ENV: "test"
          JWT_SECRET: "test_jwt_secret_key_12345"
          JWT_REFRESH_SECRET: "test_jwt_refresh_secret_key_12345"
          JWT_EXPIRES_IN: "1d"
          JWT_REFRESH_EXPIRES_IN: "7d"
          STRIPE_SECRET_KEY: "sk_test_mock_stripe_key_for_ci_testing"
          STRIPE_WEBHOOK_SECRET: "whsec_test_mock_secret"
          REDIS_HOST: "127.0.0.1"
          REDIS_PORT: 6379
          SMTP_HOST: "127.0.0.1"
          SMTP_PORT: 1025
          SMTP_SECURE: "false"
          SMTP_IGNORE_TLS: "true"
          MAIL_HOST: "127.0.0.1"
          MAIL_PORT: 1025
          MAIL_SECURE: "false"
          MAIL_IGNORE_TLS: "true"
          NODE_TLS_REJECT_UNAUTHORIZED: "0"

      - name: Wait for Server to be ready
        run: |
          npx wait-on http://127.0.0.1:5000/api-docs --timeout 30000

      - name: Install Newman & Reporter
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run Postman Tests
        run: |
          newman run postman/collection.json \
            -e postman/environment.json \
            -r cli,htmlextra \
            --reporter-htmlextra-export newman-report.html || true

      - name: Upload Server Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: server.log

      - name: Upload Newman HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: newman-report.html