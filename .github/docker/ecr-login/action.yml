name: Login to Amazon ECR
description: Assume the AWS role via OIDC and log Docker in to ECR

inputs:
  role_arn:
    description: IAM role to assume via OIDC (needs id-token write permission)
    required: true
  aws_region:
    description: AWS region of the ECR registry
    required: true

outputs:
  registry:
    description: ECR registry URL (e.g. 123456789012.dkr.ecr.eu-central-1.amazonaws.com)
    value: ${{ steps.login-ecr.outputs.registry }}

runs:
  using: composite
  steps:
    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.role_arn }}
        aws-region: ${{ inputs.aws_region }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
