name: Build Develop Image

on:
  push:
    branches:
      - develop

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pipeline:
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/pipeline.yml
    with:
      environment: develop
      cache_scope: develop
    secrets: inherit
