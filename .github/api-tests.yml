name: API Automated Tests

on:
  workflow_dispatch: # Додає кнопку "Run workflow" у GitHub
  pull_request:
    branches: [ main, master, develop ]

jobs:
  run-api-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: dogood_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Database Migrations
        run: npx prisma db push
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/dogood_db?schema=public"

      - name: Start Backend API Server
        run: npm start &
        env:
          PORT: 5000
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/dogood_db?schema=public"

      - name: Wait for API to be ready
        run: npx wait-on http://localhost:5000/auth/current-user -t 30000

      - name: Install Newman & Reporter
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run Postman Tests via Newman
        run: |
          newman run postman/collection.json \
            -e postman/environment.json \
            -r cli,htmlextra \
            --reporter-htmlextra-export postman-report.html

      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-html-report
          path: postman-report.html
