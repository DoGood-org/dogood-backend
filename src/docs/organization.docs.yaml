openapi: 3.0.3
info:
  title: Organization API
  version: 1.0.0
  description: API for managing organizations, members, and join requests. Protected routes require a valid accessToken cookie.

servers:
  - url: http://localhost:5000/
    description: Local development server

tags:
  - name: Organization
  - name: Members
  - name: JoinRequest

paths:
  /organization/create:
    post:
      tags: [Organization]
      summary: Create a new organization
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /organization/{id}:
    get:
      tags: [Organization]
      summary: Get organization by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FullOrganizationResponse'

    patch:
      tags: [Organization]
      summary: Update organization (ADMIN only)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganization'
      responses:
        '200':
          description: Updated
        '403':
          description: Only ADMIN can update

    delete:
      tags: [Organization]
      summary: Delete organization (ADMIN/HOST only)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Deleted

  /organization/members:
    post:
      tags: [Members]
      summary: Add a member directly (ADMIN/MODERATOR only)
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberInput'
      responses:
        '201':
          description: Added

  /organization/members/role:
    patch:
      tags: [Members]
      summary: Update member role (ADMIN only)
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleInput'
      responses:
        '200':
          description: Role updated

  /organization/join-request:
    post:
      tags: [JoinRequest]
      summary: Create a join request (senderId from token)
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJoinRequestInput'
      responses:
        '201':
          description: Request created

  /organization/join-request/status:
    patch:
      tags: [JoinRequest]
      summary: Update join request status
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateJoinRequestStatusInput'
      responses:
        '200':
          description: Status updated

  /organization/{organizationId}/join-requests:
    get:
      tags: [JoinRequest]
      summary: Get all pending join requests for a specific organization
      description: Returns a list of pending requests where the organization is the receiver. Accessible only by ADMIN or MODERATOR.
      operationId: getJoinRequestsForOrganization
      security:
        - cookieAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinRequestsListResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /organization/join-request/{id}:
    get:
      tags: [JoinRequest]
      summary: Get details of a pending join request
      description: Returns join request details. Accessible by the sender or organization staff (ADMIN/MODERATOR).
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the Join Request
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinRequestResponse'
        '403':
          description: Forbidden - You don't have access to this request
        '404':
          description: Request not found

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: accessToken

  schemas:
    SuccessResponse:
      type: object
      properties:
        status: { type: string, example: "success" }
        code: { type: string }
        message: { type: string }
        data: { type: object, nullable: true }

    ErrorResponse:
      type: object
      required: [status, statusCode, code, message]
      properties:
        status: { type: string, example: "error" }
        statusCode: { type: integer }
        code: { type: string }
        message: { type: string }

    LocationInput:
      type: object
      required: [country, region, city]
      properties:
        country: { type: string, minLength: 2, maxLength: 100 }
        region: { type: string, minLength: 2, maxLength: 100 }
        city: { type: string, minLength: 2, maxLength: 100 }

    Location:
      type: object
      properties:
        id: { type: string, format: uuid }
        country: { type: string }
        region: { type: string, nullable: true }
        city: { type: string }
        address: { type: string, nullable: true }

    FullOrganizationResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                organization:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    name: { type: string }
                    description: { type: string, nullable: true }
                    avatar: { type: string, nullable: true }
                    email: { type: string, nullable: true }
                    phoneNumber: { type: string, nullable: true }
                    createdAt: { type: string, format: date-time }
                    location:
                      $ref: '#/components/schemas/Location'

    CreateOrganizationInput:
      type: object
      required: [organizationName, description, location, phoneNumber, email]
      properties:
        organizationName: { type: string, minLength: 2, maxLength: 50 }
        description: { type: string, maxLength: 1000 }
        avatar: { type: string, format: uri }
        location: { $ref: '#/components/schemas/LocationInput' }
        phoneNumber: { type: string, minLength: 5, maxLength: 30 }
        email: { type: string, format: email }

    UpdateOrganization:
      type: object
      properties:
        organizationName: { type: string }
        description: { type: string }
        phoneNumber: { type: string }
        location:
          type: object
          properties:
            country: { type: string }
            city: { type: string }
            address: { type: string }

    AddMemberInput:
      type: object
      required: [userId, organizationId, role]
      properties:
        userId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        role: { type: string, enum: [MODERATOR, MEMBER] }

    UpdateRoleInput:
      type: object
      required: [organizationId, userId, role]
      properties:
        organizationId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        role: { type: string, enum: [MODERATOR, MEMBER] }

    CreateJoinRequestInput:
      type: object
      required: [direction]
      properties:
        receiverOrganizationId: { type: string, format: uuid, nullable: true }
        receiverUserId: { type: string, format: uuid, nullable: true }
        direction: { type: string, enum: [FROM_USER, FROM_ORGANIZATION] }

    UpdateJoinRequestStatusInput:
      type: object
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [ACCEPTED, REJECTED, CANCELLED] }

    JoinRequestResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, ACCEPTED, REJECTED, CANCELLED] }
        direction: { type: string, enum: [FROM_USER, FROM_ORGANIZATION] }
        createdAt: { type: string, format: date-time }
        sender:
          type: object
          nullable: true
          properties:
            id: { type: string }
            email: { type: string }
            profile: { type: object, nullable: true }
        senderOrganization:
          type: object
          nullable: true
          properties:
            id: { type: string }
            name: { type: string }

    JoinRequestsListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                joinRequests:
                  type: array
                  items:
                    $ref: '#/components/schemas/JoinRequestResponse'