openapi: 3.0.3
info:
  title: Auth API
  version: 1.0.0
  description: Authentication & authorization endpoints (signup, login, tokens, password reset)

servers:
  - url: http://localhost:5000
    description: Local server

paths:
  /auth/signup:
    post:
      tags: [Auth]
      summary: Register a new user
      operationId: registerUser
      parameters:
        - in: query
          name: lang
          schema:
            type: string
            default: en
          description: Language for verification email content
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: User created, verification email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessBaseResponse'
              examples:
                userRegistered:
                  value:
                    status: success
                    code: USER_REGISTERED
                    message: User created. Please check your email to verify.
        '400':
          description: Validation error in request body
        '409':
          description: User already exists

  /auth/create-organization:
    post:
      tags: [Auth]
      summary: Register a new user and create an associated organization
      operationId: registerOrganization
      parameters:
        - in: query
          name: lang
          schema:
            type: string
            default: en
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: User and Organization created
        '400':
          description: Validation error
        '409':
          description: Conflict - User or Organization already exists

  /auth/login:
    post:
      tags: [Auth]
      summary: Login user
      operationId: logIn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: User logged in successfully
          headers:
            Set-Cookie:
              description: Sets `accessToken` and `refreshToken` HttpOnly cookies.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccessResponse'
        '400':
          description: Invalid credentials
        '403':
          description: Email not verified OR User account suspended (banned)
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      status: { type: string, example: error }
                      statusCode: { type: integer, example: 403 }
                      code: { type: string, example: AUTH_EMAIL_NOT_VERIFIED }
                      message: { type: string, example: Please verify your email }
                  - $ref: '#/components/schemas/BannedUserResponse'
              examples:
                emailNotVerified:
                  summary: Email not verified
                  value:
                    status: error
                    statusCode: 403
                    code: AUTH_EMAIL_NOT_VERIFIED
                    message: Please verify your email
                userBanned:
                  summary: Account suspended (Banned)
                  value:
                    message: Your account has been suspended
                    code: AUTH_REFRESH_TOKEN_INVALID
                    bannedUser:
                      accountId: "uuid-string-here"
                      suspendedOn: "2026-05-20T12:00:00.000Z"
                      suspensionType: "Temporary"
                      reason: "Distributing spam"
                      banExpiresAt: "2026-05-23T12:00:00.000Z"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout user
      operationId: logOut
      responses:
        '204':
          description: User logged out, cookies cleared
        '400':
          description: No refresh token provided

  /auth/verify-email/{verificationCode}:
    get:
      tags: [Auth]
      summary: Verify user email
      parameters:
        - in: path
          name: verificationCode
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Verified successfully
        '400':
          description: Invalid or expired code

  /auth/resend-verification:
    post:
      tags: [Auth]
      summary: Resend verification email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Email resent
        '404':
          description: User not found

  /auth/current-user:
    get:
      tags: [Auth]
      summary: Get current authenticated user
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Current user data
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  message: { type: string, example: User data retrieved }
                  code: { type: string, example: USER_DATA_RETRIEVED }
                  user: { $ref: '#/components/schemas/SafeUser' }
        '401':
          description: Unauthorized
        '403':
          description: User account suspended (Banned by middleware)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BannedUserResponse'
              examples:
                userBanned:
                  value:
                    message: Your account has been suspended
                    code: AUTH_REFRESH_TOKEN_INVALID
                    bannedUser:
                      accountId: "uuid-string-here"
                      suspendedOn: "2026-05-20T12:00:00.000Z"
                      suspensionType: "Temporary"
                      reason: "Distributing spam"
                      banExpiresAt: "2026-05-23T12:00:00.000Z"

  /auth/refresh-token:
    post:
      tags: [Auth]
      summary: Refresh access token using refresh token (with Race Condition handling)
      operationId: refreshTokenController
      responses:
        '200':
          description: Tokens refreshed successfully OR already refreshed by parallel request
          headers:
            Set-Cookie:
              description: Sets new `accessToken` and rotated `refreshToken`.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Tokens refreshed successfully
                  code:
                    type: string
                    example: AUTH_TOKEN_REFRESHED_SUCCESSFULY
              examples:
                refreshSuccess:
                  summary: Standard refresh
                  value:
                    message: Tokens refreshed successfully
                    code: AUTH_TOKEN_REFRESHED_SUCCESSFULY
                gracePeriod:
                  summary: Race condition (Grace Period)
                  value:
                    message: Tokens already refreshed
                    code: AUTH_TOKEN_REFRESHED_SUCCESSFULY
        '401':
          description: Refresh token missing, invalid, or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                tokenRequired:
                  value:
                    status: error
                    statusCode: 401
                    code: AUTH_REFRESH_TOKEN_INVALID
                    message: Refresh token required
                invalidOrExpired:
                  value:
                    status: error
                    statusCode: 401
                    code: AUTH_REFRESH_TOKEN_INVALID
                    message: Invalid or expired refresh token
                tokenReuse:
                  summary: Token reuse (after grace period)
                  value:
                    status: error
                    statusCode: 401
                    code: AUTH_REFRESH_TOKEN_INVALID
                    message: Invalid refresh token
        '403':
          description: User account suspended during refresh process
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BannedUserResponse'
              examples:
                userBanned:
                  value:
                    message: Access denied. Account suspended.
                    code: AUTH_REFRESH_TOKEN_INVALID
                    bannedUser:
                      accountId: "uuid-string-here"
                      suspendedOn: "2026-05-20T12:00:00.000Z"
                      suspensionType: "Temporary"
                      reason: "Distributing spam"
                      banExpiresAt: "2026-05-23T12:00:00.000Z"
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Send reset password email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Reset email sent
        '404':
          description: User not found

  /auth/reset-password/{resetPasswordToken}:
    post:
      tags: [Auth]
      summary: Reset password using token
      parameters:
        - in: path
          name: resetPasswordToken
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset success
        '400':
          description: Invalid token or validation error

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: accessToken

  schemas:
    ErrorResponse:
      type: object
      required: [status, statusCode, code, message]
      properties:
        status: { type: string, example: error }
        statusCode: { type: integer, example: 400 }
        code: { type: string, example: AUTH_INVALID_CREDENTIALS }
        message: { type: string, example: Invalid email or password }
        details: { type: object, nullable: true }

    SuccessBaseResponse:
      type: object
      properties:
        status: { type: string, example: success }
        code: { type: string }
        message: { type: string }

    SignUpRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, example: John Doe }
        email: { type: string, format: email, example: john@example.com }
        password: { type: string, format: password, example: "StrongPassword123!" }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    ResetPasswordRequest:
      type: object
      required: [password]
      properties:
        password: { type: string, format: password }

    LoginSuccessResponse:
      type: object
      properties:
        message: { type: string, example: User logged in successfully }
        code: { type: string, example: USER_LOGGED_IN }
        user: { $ref: '#/components/schemas/LoginUser' }

    LoginUser:
      type: object
      properties:
        id: { type: string, example: "uuid" }
        name: { type: string }
        email: { type: string, format: email }
        avatar: { type: string, nullable: true }
        siteRole: { type: string, example: USER }
        settings:
          type: object
          properties:
            theme: { type: string, example: light }
            language: { type: string, example: en }
        profile: { $ref: '#/components/schemas/UserProfile', nullable: true }

    SafeUser:
      type: object
      properties:
        id: { type: string, example: "uuid" }
        email: { type: string, format: email }
        name: { type: string }
        siteRole: { type: string, example: USER }
        isEmailVerified: { type: boolean }
        profile: { $ref: '#/components/schemas/UserProfile' }
        userSettings: { $ref: '#/components/schemas/UserSettings' }

    UserProfile:
      type: object
      nullable: true
      properties:
        id: { type: integer }
        bio: { type: string, nullable: true }
        avatar: { type: string, nullable: true }
        gender: { type: string, nullable: true }
        birthDate: { type: string, format: date-time, nullable: true }
        phoneNumber: { type: string, nullable: true }

    UserSettings:
      type: object
      nullable: true
      properties:
        id: { type: integer }
        theme: { type: string, example: dark }
        language: { type: string, example: en }

    CreateOrganizationRequest:
      type: object
      required: [name, email, password, organizationName]
      properties:
        name: { type: string, example: John Doe }
        email: { type: string, example: john.doe@example.com }
        password: { type: string, example: "Secret123!" }
        organizationName: { type: string, example: Acme Corporation LLC }

    UserStatus:
      type: string
      enum: [ACTIVE, BANNED]

    BlockType:
      type: string
      enum: [THREE_DAYS, ONE_WEEK, ONE_MONTH, CUSTOM, PERMANENT]
      nullable: true

    BannedUserResponse:
      type: object
      required: [message, code, bannedUser]
      properties:
        message: { type: string, example: "Your account has been suspended" }
        code: { type: string, example: "AUTH_REFRESH_TOKEN_INVALID" }
        bannedUser:
          type: object
          required: [accountId, suspendedOn, suspensionType, reason, banExpiresAt]
          properties:
            accountId: { type: string, example: "uuid" }
            suspendedOn: { type: string, format: date-time, example: "2026-05-20T12:00:00.000Z" }
            suspensionType: { $ref: '#/components/schemas/BlockType' }
            reason: { type: string, example: "Distributing spam" }
            banExpiresAt: { type: string, format: date-time, nullable: true, example: "2026-05-23T12:00:00.000Z" }