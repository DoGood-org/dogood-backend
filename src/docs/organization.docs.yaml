openapi: 3.0.3
info:
  title: Organization API
  version: 1.1.0
  description: >
    API for managing organizations, members, and join requests. 
    Protected routes require a valid accessToken cookie.
    Updated with Stripe integration and expanded organization details.

servers:
  - url: http://localhost:5000/
    description: Local development server

tags:
  - name: Organization
  - name: Members
  - name: JoinRequest

paths:
  /organization/:
    get:
      tags: [Organization]
      summary: Find organizations by name
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
          description: The name (or part of the name) of the organization to search for
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationListResponse'
        '400':
          description: Name query parameter is missing or invalid

  /organization/create:
    post:
      tags: [Organization]
      summary: Create a new organization
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /organization/{id}:
    get:
      tags: [Organization]
      summary: Get organization by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FullOrganizationResponse'
    patch:
      tags: [Organization]
      summary: Update organization (ADMIN only)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganization'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
    delete:
      tags: [Organization]
      summary: Delete organization (ADMIN only)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Organization and related data deleted successfully

  /organization/members:
    post:
      tags: [Members]
      summary: Invite a user to organization (ADMIN/MODERATOR only)
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteMemberInput'
      responses:
        '201':
          description: Invitation sent

    delete:
      tags: [Members]
      summary: Remove a member from an organization (ADMIN/MODERATOR only)
      description: >
        Removes a member from an organization.
        Only organization ADMIN or MODERATOR members are allowed to remove other members.
        The removed user will receive a notification.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveMemberInput'
      responses:
        '200':
          description: Member removed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationSuccessResponse'
        '400':
          description: userId or organizationId is missing or invalid
        '401':
          description: Authentication required
        '403':
          description: User does not have permission to remove members
        '404':
          description: Organization or member not found

  /organization/members/role:
    patch:
      tags: [Members]
      summary: Update member role (ADMIN only)
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleInput'
      responses:
        '200':
          description: Role updated
  
  /organization/join-request:
    post:
      tags: [JoinRequest]
      summary: Create a join request or organization invitation
      description: >
        Creates a new pending join request.
        Depending on the direction, this endpoint either allows a user to request
        joining an organization or allows an organization to invite a user.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJoinRequestInput'
      responses:
        '201':
          description: Join request created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinRequestResponse'
        '400':
          description: Join request already exists or request body is invalid
        '401':
          description: Authentication required


  /organization/join-request/status:
    patch:
      tags: [JoinRequest]
      summary: Update join request status
      description: >
        Updates the status of a pending join request.
        Depending on the request direction, only organization staff
        (ADMIN or MODERATOR) or the invited user may perform this action.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateJoinRequestStatusInput'
      responses:
        '200':
          description: Join request updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinRequestResponse'
        '400':
          description: Join request already processed or invalid request
        '401':
          description: Authentication required
        '403':
          description: User does not have permission to update this request
        '404':
          description: Join request not found

  /organization/{organizationId}/join-requests:
    get:
      tags: [JoinRequest]
      summary: Get pending join requests for an organization
      description: >
        Returns all pending join requests for the specified organization.
        Accessible only to organization ADMIN and MODERATOR members.
      security:
        - cookieAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Join requests retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinRequestListResponse'
        '400':
          description: Organization ID is missing
        '401':
          description: Authentication required
        '403':
          description: User is not allowed to view organization join requests
        '404':
          description: Organization not found


  /organization/join-request/{id}:
    get:
      tags: [JoinRequest]
      summary: Get join request by ID
      description: >
        Returns a pending join request.
        Accessible to the request sender or organization staff.
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Join request retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinRequestResponse'
        '400':
          description: Join request already processed or invalid ID
        '401':
          description: Authentication required
        '403':
          description: User does not have permission to view this request
        '404':
          description: Join request not found
  

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: accessToken

  schemas:
    SuccessResponse:
      type: object
      properties:
        status: { type: string, example: "success" }
        code: { type: string }
        message: { type: string }
        data: { type: object, nullable: true }

    OperationSuccessResponse:
      type: object
      properties:
        status: { type: string, example: "success" }
        code: { type: string }
        message: { type: string }

    OrganizationListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Organization'

    Organization:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        moreInfo: { type: string, nullable: true }
        phoneNumber: { type: string, nullable: true }
        email: { type: string, nullable: true }
        avatar: { type: string, nullable: true }
        stripeCustomerId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    CreateOrganizationInput:
      type: object
      required: [organizationName, description, location, phoneNumber, email]
      properties:
        name: { type: string, minLength: 2, maxLength: 50 }
        description: { type: string, maxLength: 1000 }
        moreInfo: { type: string, maxLength: 2000, nullable: true }
        avatar: { type: string, format: uri }
        stripeCustomerId: { type: string, example: "cus_Rl9..." }
        phoneNumber: { type: string }
        email: { type: string, format: email }
        location:
          type: object
          required: [country, region, city]
          properties:
            country: { type: string }
            region: { type: string }
            city: { type: string }

    UpdateOrganization:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        moreInfo: { type: string }
        phoneNumber: { type: string }
        email: { type: string }
        avatar: { type: string }
        stripeCustomerId: { type: string }
        location:
          type: object
          properties:
            country: { type: string }
            region: { type: string }
            city: { type: string }

    FullOrganizationResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                organization:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    name: { type: string }
                    description: { type: string }
                    moreInfo: { type: string, nullable: true }
                    phoneNumber: { type: string, nullable: true }
                    email: { type: string, nullable: true }
                    avatar: { type: string, nullable: true }
                    stripeCustomerId: { type: string, nullable: true }
                    createdAt: { type: string, format: date-time }
                    location:
                      type: object
                      properties:
                        id: { type: integer }
                        country: { type: string }
                        region: { type: string }
                        city: { type: string }
                    hostId: { type: string, format: uuid, nullable: true }
                    tasks:
                      type: array
                      items: { type: object }
                    members:
                      type: array
                      items:
                        $ref: '#/components/schemas/MemberInfo'

    MemberInfo:
      type: object
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [ADMIN, MODERATOR, MEMBER] }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        user:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            profile:
              type: object
              properties:
                avatar: { type: string, nullable: true }

    InviteMemberInput:
      type: object
      required: [userId, organizationId, role]
      properties:
        userId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        role: { type: string, enum: [MODERATOR, MEMBER] }

    RemoveMemberInput:
      type: object
      required:
        - userId
        - organizationId
      properties:
        userId:
          type: string
          format: uuid
          description: ID of the member to remove.
        organizationId:
          type: string
          format: uuid
          description: ID of the organization.

    UpdateRoleInput:
      type: object
      required: [organizationId, userId, role]
      properties:
        organizationId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        role: { type: string, enum: [MODERATOR, MEMBER] }

    LocationSchema:
      type: object
      nullable: true
      properties:
        id: { type: integer }
        country: { type: string, nullable: true }
        region: { type: string, nullable: true }
        city: { type: string, nullable: true }

    JoinRequestSchema:
      type: object
      properties:
        id: { type: string, format: uuid}
        senderId: { type: string, format: uuid, nullable: true}
        senderOrganizationId: { type: string, format: uuid, nullable: true}
        receiverOrganizationId: { type: string, format: uuid, nullable: true }
        receiverUserId: { type: string, format: uuid, nullable: true }
        status:
          type: string
          enum:
            - PENDING
            - ACCEPTED
            - REJECTED
            - CANCELLED
        direction:
          type: string
          enum:
            - FROM_USER
            - FROM_ORGANIZATION
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        sender:
          type: object
          nullable: true
          properties:
            name:
              type: string
        senderOrganization:
          type: object
          nullable: true
          properties:
            name:
              type: string
        receiverOrganization:
          type: object
          nullable: true
          properties:
            name:
              type: string
        receiverUser:
          type: object
          nullable: true
          properties:
            name:
              type: string

    CreateJoinRequestInput:
      type: object
      required:
        - direction
      properties:
        receiverOrganizationId:
          type: string
          format: uuid
          nullable: true
          description: Required when direction is FROM_USER.
        receiverUserId:
          type: string
          format: uuid
          nullable: true
          description: Required when direction is FROM_ORGANIZATION.
        direction:
          type: string
          enum:
            - FROM_USER
            - FROM_ORGANIZATION 

    UpdateJoinRequestStatusInput:
      type: object
      required:
        - id
        - status
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - PENDING
            - ACCEPTED
            - REJECTED
            - CANCELLED

    JoinRequestResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                joinRequest:
                  $ref: '#/components/schemas/JoinRequestSchema'

    JoinRequestListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                joinRequests:
                  type: array
                  items:
                    $ref: '#/components/schemas/JoinRequestSchema'
