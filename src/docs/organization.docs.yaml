openapi: 3.0.3
info:
  title: Organization API
  version: 1.1.0
  description: >
    API for managing organizations, members, and join requests. 
    Protected routes require a valid accessToken cookie.
    Updated with Stripe integration and expanded organization details.

servers:
  - url: http://localhost:5000/
    description: Local development server

tags:
  - name: Organization
  - name: Members
  - name: JoinRequest

paths:
  /organization/:
    get:
      tags: [Organization]
      summary: Find organizations by name
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
          description: The name (or part of the name) of the organization to search for
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationListResponse'
        '400':
          description: Name query parameter is missing or invalid

  /organization/create:
    post:
      tags: [Organization]
      summary: Create a new organization
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /organization/{id}:
    get:
      tags: [Organization]
      summary: Get organization by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FullOrganizationResponse'
    patch:
      tags: [Organization]
      summary: Update organization (ADMIN only)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganization'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
    delete:
      tags: [Organization]
      summary: Delete organization (ADMIN only)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Organization and related data deleted successfully

  /organization/members/invite:
    post:
      tags: [Members]
      summary: Invite a user to organization (ADMIN/MODERATOR only)
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteMemberInput'
      responses:
        '201':
          description: Invitation sent

  /organization/members/role:
    patch:
      tags: [Members]
      summary: Update member role (ADMIN only)
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleInput'
      responses:
        '200':
          description: Role updated

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: accessToken

  schemas:
    SuccessResponse:
      type: object
      properties:
        status: { type: string, example: "success" }
        code: { type: string }
        message: { type: string }
        data: { type: object, nullable: true }

    OrganizationListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Organization'

    Organization:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        moreInfo: { type: string, nullable: true }
        phoneNumber: { type: string, nullable: true }
        email: { type: string, nullable: true }
        avatar: { type: string, nullable: true }
        stripeCustomerId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    CreateOrganizationInput:
      type: object
      required: [organizationName, description, location, phoneNumber, email]
      properties:
        name: { type: string, minLength: 2, maxLength: 50 }
        description: { type: string, maxLength: 1000 }
        moreInfo: { type: string, maxLength: 2000, nullable: true }
        avatar: { type: string, format: uri }
        stripeCustomerId: { type: string, example: "cus_Rl9..." }
        phoneNumber: { type: string }
        email: { type: string, format: email }
        location:
          type: object
          required: [country, region, city]
          properties:
            country: { type: string }
            region: { type: string }
            city: { type: string }

    UpdateOrganization:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        moreInfo: { type: string }
        phoneNumber: { type: string }
        email: { type: string }
        avatar: { type: string }
        stripeCustomerId: { type: string }
        location:
          type: object
          properties:
            country: { type: string }
            region: { type: string }
            city: { type: string }

    FullOrganizationResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                organization:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    name: { type: string }
                    description: { type: string }
                    moreInfo: { type: string, nullable: true }
                    phoneNumber: { type: string, nullable: true }
                    email: { type: string, nullable: true }
                    avatar: { type: string, nullable: true }
                    stripeCustomerId: { type: string, nullable: true }
                    createdAt: { type: string, format: date-time }
                    location:
                      type: object
                      properties:
                        id: { type: integer }
                        country: { type: string }
                        region: { type: string }
                        city: { type: string }
                    hostId: { type: string, format: uuid, nullable: true }
                    tasks:
                      type: array
                      items: { type: object }
                    members:
                      type: array
                      items:
                        $ref: '#/components/schemas/MemberInfo'

    MemberInfo:
      type: object
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [ADMIN, MODERATOR, MEMBER] }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        user:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            profile:
              type: object
              properties:
                avatar: { type: string, nullable: true }

    InviteMemberInput:
      type: object
      required: [userId, organizationId, role]
      properties:
        userId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        role: { type: string, enum: [MODERATOR, MEMBER] }

    UpdateRoleInput:
      type: object
      required: [organizationId, userId, role]
      properties:
        organizationId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        role: { type: string, enum: [MODERATOR, MEMBER] }